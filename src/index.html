<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy. Defends the rich-text Terms / Notes / extra-section
      paths which inject sanitized HTML via DOMPurify. Even if the sanitizer config
      is ever loosened, the CSP locks scripts to same-origin so injected script
      tags can't execute, and connect-src is limited to localhost + Google
      services (only place we make outbound calls).
    -->
    <!--
      v1.10.33 — Tesseract assets now bundled into public/tesseract/ by
      scripts/bundle-tesseract-assets.mjs. That means:
        - script-src no longer needs https://cdn.jsdelivr.net (worker
          serves from same-origin)
        - connect-src no longer needs jsdelivr or tessdata.projectnaptha
          (traineddata + core WASM serve from same-origin)
      What STAYS wide:
        - 'wasm-unsafe-eval' in script-src → tesseract-core compiles a
          WebAssembly module, which requires this outside of a fresh
          instantiation flow
        - worker-src 'self' blob: → tesseract creates its worker from a
          blob URL. Without an explicit worker-src, it falls back to
          script-src (which excludes blob:) and blocks the worker.
        - style-src http://localhost:* → html2canvas clones the invoice
          into an ABOUT:BLANK iframe before rasterising it. Firefox
          inherits the CSP into that iframe but resolves 'self' against
          about:blank's NULL origin, so 'self' matches nothing and the
          app's own stylesheet is refused — the PDF then renders
          UNSTYLED. Chrome resolves 'self' to the inherited origin, which
          is why this never showed up in Chrome testing. Naming the real
          origin sidesteps the 'self' resolution entirely; connect-src
          already lists http://localhost:* for a comparable reason.
          Reported as "pdf save as thermal printer" — it was not thermal,
          it was an invoice with no CSS.
          v1.10.77: http://127.0.0.1:* as well, for the app opened by that
          address (the PDF lost its stylesheet there).
        - frame-src 'self' blob: → Print and Save-as-PDF render the
          generated PDF into a hidden iframe via createObjectURL (see
          printViaIframe in InvoiceGenerator.jsx and the same pattern in
          PrintSettings.jsx). Without blob: here the iframe is blocked
          outright and Print silently does nothing. Reported on Firefox,
          which enforces frame-src against blob: strictly; Chrome was
          laxer, which is why this survived to v1.10.46 unnoticed.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src  'self' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com;
      worker-src  'self' blob:;
      style-src   'self' 'unsafe-inline' http://localhost:* http://127.0.0.1:* https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com data:;
      img-src     'self' data: blob: https://*.googleusercontent.com https://*.supabase.co;
      connect-src 'self' http://localhost:* http://127.0.0.1:* https://*.supabase.co wss://*.supabase.co https://accounts.google.com https://www.googleapis.com;
      frame-src   'self' blob: https://accounts.google.com;
      object-src  'none';
      base-uri    'self';
    " />

    <!-- Primary SEO -->
    <title>Billenza — Precision GST Invoicing & Compliance Engine</title>
    <meta name="description" content="Billenza Cloud — Precision GST Invoicing, GSTR-1, GSTR-3B & GSTR-2B compliance engine for businesses and enterprises. Real-time PostgreSQL sync, multi-currency, and professional billing." />
    <meta name="keywords" content="Billenza, GST invoice generator, GST billing software, billing SaaS India, cloud invoice maker, tax invoice, GSTR-1 filing, GSTR-3B filing, GSTR-2B reconciliation, e-way bill" />
    <meta name="author" content="Billenza" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Billenza Cloud" />
    <meta property="og:title" content="Billenza — Precision GST Invoicing & Compliance Engine" />
    <meta property="og:description" content="Modern GST billing and compliance platform for Indian businesses. Automated taxes, GSTR-1/3B/2B reconciliation, e-Way bills, multi-currency invoicing, and real-time cloud sync." />
    <meta property="og:image" content="/og-preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Billenza — Precision GST Invoicing & Compliance Engine" />
    <meta name="twitter:description" content="Modern GST billing and compliance platform for Indian businesses. Automated taxes, GSTR-1/3B/2B reconciliation, e-Way bills, multi-currency invoicing, and real-time cloud sync." />
    <meta name="twitter:image" content="/og-preview.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      v1.10.2 — iOS Home Screen support. Prior version had a single
      apple-touch-icon pointing at favicon.svg, which iOS silently
      ignored (Safari requires PNG for apple-touch-icon and generates
      a screenshot tile otherwise). The PNGs referenced below need to
      be placed into public/icons/ — see README section "PWA icons".
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- v1.10.33 — Chrome deprecated the apple-* variant. Keep both for
         cross-browser installability. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GST Billing" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme -->
    <meta name="theme-color" content="#1e40af" />

    <!-- Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Billenza Cloud",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All modern browsers",
      "description": "Precision GST invoicing & tax compliance SaaS engine for businesses in India. Tax Invoice, Proforma, Credit Note, Bill of Supply, Delivery Challan, E-Way Bill, and GSTR filing reports."
    }
    </script>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      This file is the React app entry — never opened directly by users.
      It lives in src/ rather than the project root so users don't see
      it in their install folder. The Vite build transforms it into
      dist/index.html which Express serves at http://localhost:47371/.
      The user-facing HTML at the project root is the launcher.
    -->
    <noscript>
      <div style="font-family:sans-serif;padding:2rem;max-width:600px;margin:2rem auto;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#991b1b">
        <h2>JavaScript is required</h2>
        <p>This page is the Free GST Billing Software app. It needs JavaScript to run.</p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
